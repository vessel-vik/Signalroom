name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Self-check (no model)
        run: python3 signalroom.py self-check
      - name: Python unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Dashboard render test
        run: node tests/test_dashboard.js
